<header class="topbar">
  <a class="brand" routerLink="/">Jacq-Quack-Quiz</a>

  <div class="right">
    <span class="clock">{{ now }}</span>

    <!-- Logout nur, wenn ein User eingeloggt ist -->
    <ng-container *ngIf="hasUser">
      <button class="btn" (click)="openLogoutConfirm()">Logout</button>
    </ng-container>
  </div>
</header>

<!-- Logout-Modal -->
<div class="modal-backdrop" *ngIf="showLogoutConfirm">
  <div class="modal">
    <h2>Wirklich ausloggen?</h2>
    <p>Bei „Ja“ geht’s erst zum Abspann und danach automatisch zur Login-Seite.</p>
    <div class="actions">
      <button class="btn" (click)="stayLoggedIn()">Nein</button>
      <button class="btn danger" (click)="confirmLogout()">Ja</button>
    </div>
  </div>
</div>
