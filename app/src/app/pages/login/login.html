<div class="page">
  <div class="login-card">
    <h1>
      Willkommen in der<br />
      <span class="school">Coding-Schule-Orlean</span>
    </h1>

    <label>Benutzername</label>
    <div class="input-wrap">
      <input [(ngModel)]="username" type="text" placeholder="z. B. Monja" />
    </div>

    <label>Passwort</label>
    <div class="input-wrap">
      <input [(ngModel)]="password" [type]="showPw ? 'text' : 'password'" placeholder="••••••" />
      <button class="pw-toggle" type="button" (click)="showPw = !showPw" title="Passwort ein-/ausblenden">👁️</button>
    </div>

    <div class="actions">
      <button class="btn" type="button" (click)="doLogin()">Login</button>
    </div>
  </div>
</div>
