<div class="page">
  <div class="card">
    <h1>Registrieren</h1>

    <div class="msg" *ngIf="msg">{{ msg }}</div>

    <form (ngSubmit)="onSubmit()">
      <label>Benutzername</label>
      <input type="text" name="username" [(ngModel)]="username" placeholder="z. B. Monja" autocomplete="username" />

      <label>E-Mail</label>
      <input type="email" name="email" [(ngModel)]="email" placeholder="du@beispiel.de" autocomplete="email" />

      <label>Geburtsjahr</label>
      <input type="number" name="birthYear" [(ngModel)]="birthYear" placeholder="z. B. 1995" />

      <label>Passwort</label>
      <input type="password" name="password" [(ngModel)]="password" placeholder="••••••" autocomplete="new-password" />

      <div class="actions">
        <button class="btn primary" type="submit" [disabled]="loading">
          {{ loading ? 'Bitte warten…' : 'Registrieren' }}
        </button>
      </div>
    </form>
  </div>
</div>
