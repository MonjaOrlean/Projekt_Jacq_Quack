<!-- src/app/pages/account/account.html -->
<div class="page">
  <div class="card" *ngIf="user; else noUser">
    <h1>Account löschen</h1>
    <p>
      <b>Angemeldet als:</b> {{ user.username }}<br />
      {{ user.email }}
    </p>

    <p>Zur Sicherheit bitte Benutzername & Passwort bestätigen.</p>

    <label>
      Benutzername bestätigen:
      <input type="text" [(ngModel)]="confirmName" [placeholder]="user.username" />
    </label>

    <label>
      Passwort:
      <input type="password" [(ngModel)]="password" placeholder="••••••" />
    </label>

    <p class="msg ok" *ngIf="msg">{{ msg }}</p>
    <p class="msg err" *ngIf="err">{{ err }}</p>

    <div class="actions">
      <button class="btn danger" (click)="onDelete()" [disabled]="busy || !canDelete">
        {{ busy ? 'Lösche…' : 'Endgültig löschen' }}
      </button>
    </div>
  </div>

  <ng-template #noUser>
    <div class="card">
      <h1>Nicht eingeloggt</h1>
      <p>Bitte zuerst anmelden.</p>
    </div>
  </ng-template>
</div>
