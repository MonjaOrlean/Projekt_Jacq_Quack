<div class="page">
  <!-- Hintergrund -->
  <img class="bg" src="img/Klassenzimmer.png" alt="Klassenzimmer" />

  <!-- Jacq (optional) -->
  <div class="jacq">
    <img src="img/avatar/jacq_closed.png" alt="Jacq" />
  </div>

  <!-- Ergebnis-Glaskarte (immer sichtbar, damit wir sofort sehen ob Werte kommen) -->
  <div class="result-card">
    <h1>Dein Ergebnis</h1>
    <p>{{ resultText }}</p>

    <div class="actions">
      <button class="btn primary" (click)="retry()">Nochmal spielen</button>
      <button class="btn ghost" (click)="backToStart()">Zurück zur Startseite</button>
    </div>
  </div>
</div>
